<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MCQ Arcade</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MCQ Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one console column; each topic is a server "rack" with one status LED per question */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#13202A; --muted:#5A6873; --line:#D2D9DF;
  --accent:#9A5B00; --accent-fill:#E8981C; --on-accent:#1B1100; --accent-soft:#FBEBD0;
  --good:#0F7A57; --good-bg:#DCF2E8; --bad:#BC3628; --bad-bg:#FBE3DF; --led-off:#C7D0D8;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1317; --surface:#162027; --surface-2:#1B262E; --ink:#E3E9ED; --muted:#8E9CA7; --line:#26333C;
  --accent:#F2B246; --accent-fill:#F2B246; --on-accent:#1B1100; --accent-soft:#3A2B10;
  --good:#3FCB95; --good-bg:#10362A; --bad:#FF7E6E; --bad-bg:#3F1D19; --led-off:#2C3943; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#162027; --surface-2:#1B262E; --ink:#E3E9ED; --muted:#8E9CA7; --line:#26333C;
  --accent:#F2B246; --accent-fill:#F2B246; --on-accent:#1B1100; --accent-soft:#3A2B10;
  --good:#3FCB95; --good-bg:#10362A; --bad:#FF7E6E; --bad-bg:#3F1D19; --led-off:#2C3943; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-fill);outline-offset:2px;border-radius:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px;transition:transform .12s, background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 14px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Home */
.hero{display:grid;gap:14px;padding-block:8px 18px}
.hero h1{font-size:clamp(34px,8vw,52px);font-weight:800;line-height:1}
.hero h1 span{color:var(--accent)}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;min-width:0}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.stage{margin-top:30px;display:grid;gap:14px}
.stage-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.stage-head h2{font-size:24px;font-weight:800}
.racks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.rack{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start}
.rack-head{display:flex;justify-content:space-between;gap:12px;align-items:start}
.rack-head h3{font-size:18px;font-weight:600;line-height:1.2}
.rack-head p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.rack-head .count{font-size:13px;color:var(--muted);white-space:nowrap}
.leds{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
.led{width:10px;height:10px;border-radius:3px;background:var(--led-off)}
.led.ok{background:var(--good);box-shadow:0 0 6px color-mix(in srgb,var(--good) 60%,transparent)}
.led.no{background:var(--bad);box-shadow:0 0 6px color-mix(in srgb,var(--bad) 50%,transparent)}
.rack-actions{display:flex;gap:8px;flex-wrap:wrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.panel.locked{background:var(--surface-2)}
.meter{height:8px;background:var(--led-off);border-radius:99px;overflow:hidden;position:relative}
.meter > span{display:block;height:100%;background:var(--accent-fill);border-radius:99px;transition:width .4s}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:14px;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}
.tools{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:18px}

/* Quiz */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:8px}
.qtop-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.hud{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.streak{display:inline-flex;gap:4px;align-items:center;color:var(--muted)}
.streak svg{width:16px;height:16px}
.streak.hot{color:var(--accent)}
.streak.hot svg{animation:flick 1s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.2) rotate(-6deg)}}
.qcard{margin-top:10px;display:grid;gap:16px;max-width:680px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted);background:var(--surface)}
.tag.warn{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.qtext{font-family:var(--body);font-size:clamp(18px,4.6vw,21px);font-weight:500;line-height:1.45;letter-spacing:0}
.qtext b{font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr 22px;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:56px;transition:border-color .15s, background .15s, opacity .2s, transform .12s}
.opt:hover:not(:disabled){border-color:var(--accent-fill)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt .key{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--mono);font-weight:600}
.opt .otext{min-width:0}
.opt .mark svg{width:20px;height:20px;display:block}
.opt:disabled{cursor:default}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.good .key{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .key{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt.dim{opacity:.5}
.opt.pop{animation:pop .35s ease}
.opt.shake{animation:shake .4s ease}
@keyframes pop{40%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.explain{border-radius:12px;padding:14px 16px;display:grid;gap:8px;border:1px solid var(--line);background:var(--surface);animation:rise .25s ease}
.explain.good{border-left:4px solid var(--good)}
.explain.bad{border-left:4px solid var(--bad)}
@keyframes rise{from{transform:translateY(8px);opacity:.3}}
.verdict{font-family:var(--display);font-weight:800;font-size:20px}
.explain.good .verdict{color:var(--good)}
.explain.bad .verdict{color:var(--bad)}
.explain p{margin:0}
.flagnote{font-size:14px;background:var(--accent-soft);border-radius:8px;padding:8px 10px}
.flagnote b{color:var(--accent)}
.bottombar{position:fixed;left:0;right:var(--chat-w,0px);bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bottombar .btn{width:100%;max-width:680px;margin:0 auto;display:flex}
.xpfloat{position:fixed;pointer-events:none;font-family:var(--mono);font-weight:600;color:var(--good);animation:floatup .9s ease forwards;z-index:9}
@keyframes floatup{to{transform:translateY(-40px);opacity:0}}

/* Summary */
.result{display:grid;gap:18px;padding-block:20px}
.ring{width:150px;height:150px}
.result-top{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.result-top h1{font-size:34px;font-weight:800}
.missed{display:grid;gap:10px}
.mitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px}
.mitem .q{font-weight:500}
.mitem .a{color:var(--good);font-weight:600}
.mitem .yours{color:var(--bad);font-size:14px}
.mitem .r{font-size:14px;color:var(--muted)}

/* Study */
.study{display:grid;gap:12px;margin-top:14px}
.sitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.sitem ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.sitem li{font-size:15px;padding:4px 8px;border-radius:6px;color:var(--muted)}
.sitem li.right{background:var(--good-bg);color:var(--ink);font-weight:500}
.sitem li .k{font-family:var(--mono);margin-right:8px}
.sitem .r{font-size:14px;margin:0}
.backrow{display:flex;align-items:center;gap:12px;padding-block:6px 4px}

/* Add */
textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:12px;font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;max-width:100%}
label{font-weight:600;font-size:14px}
.field{display:grid;gap:6px}
pre.sample{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;white-space:pre}
.preview{display:grid;gap:6px;font-size:14px}
.sync{display:inline-flex;align-items:center;gap:8px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--led-off);flex:none}
.sync.synced i{background:var(--good);box-shadow:0 0 6px color-mix(in srgb,var(--good) 60%,transparent)}
.sync.connecting i{background:var(--accent-fill)}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.howto > div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.howto p{margin:4px 0 0}
/* MSQ + SA */
.hint{margin:-6px 0 0;color:var(--muted);font-size:14px}
.opts.multi .key{border-radius:6px}
.opt.sel{border-color:var(--accent-fill);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--on-accent)}
.opt.missed{border-color:var(--good);border-style:dashed;background:transparent}
.opt.missed .key{color:var(--good);border-color:var(--good)}
.sa-box{display:grid;gap:8px}
.sa-box input{font:inherit;font-size:20px;font-family:var(--mono);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;min-height:56px;width:100%}
.sa-box input:focus{outline:none;border-color:var(--accent-fill);box-shadow:0 0 0 3px var(--accent-soft)}
.sa-done{display:grid;gap:4px;border-radius:12px;padding:12px 16px;border:1.5px solid var(--line);background:var(--surface)}
.sa-done b{font-family:var(--mono);font-size:20px;overflow-wrap:anywhere}
.sa-done.good{border-color:var(--good);background:var(--good-bg)}
.sa-done.bad{border-color:var(--bad);background:var(--bad-bg)}
.sa-ans{margin:0;font-size:15px}
.tag.type-msq{color:var(--accent);border-color:var(--accent)}
.tag.type-sa{color:var(--ink);border-color:var(--ink)}
/* Quick notes + mistake log */
.memo{margin:0;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-weight:500}
.tag.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.tag.good{color:var(--good);border-color:var(--good);background:var(--good-bg)}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 52px;gap:10px;align-items:center;font-size:14px}
.bname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:12px;background:var(--led-off);border-radius:99px;overflow:hidden}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.b-e{background:color-mix(in srgb,var(--bad) 30%,var(--led-off))}
.b-o{background:var(--bad)}
.bnum{text-align:right;font-size:13px;color:var(--muted)}
.key-o,.key-e{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 8px;vertical-align:-1px}
.key-o{background:var(--bad)} .key-e{background:color-mix(in srgb,var(--bad) 30%,var(--led-off))}
@media (max-width:480px){.brow{grid-template-columns:minmax(0,1fr) 52px}.brow .bar{grid-column:1/-1;grid-row:2}}
.logbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-block:12px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.lgroups{display:grid;gap:22px;margin-top:16px}
.lgroup{display:grid;gap:10px}
.lgroup h3{font-size:18px}
.litem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.litem.open{border-left:4px solid var(--bad)}
.litem.fixed{border-left:4px solid var(--good)}
.lq{font-weight:500}
.pair{display:grid;gap:4px;font-size:15px}
.pair > div{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start}
.pair svg{width:18px;height:18px;margin-top:2px}
.pair .yours{color:var(--bad)}
.pair .ans{color:var(--good);font-weight:600}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
details p{margin:8px 0 0;font-size:14px}
textarea.mynote{min-height:60px;font-family:var(--body);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---- v2: sections, auth, tutor ---- */
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-family:var(--mono);font-size:13px;color:var(--muted)}
.crumbs button{background:none;border:0;padding:4px 2px;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.crumbs span.cur{color:var(--ink)}
.rack.folder{border-left:4px solid var(--accent-fill)}
.rack-head .eyebrow{margin-bottom:2px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
details.more .row{margin-top:8px}
.secform input[type=text]{flex:1 1 220px}
.banner{background:var(--accent-soft);border:1px solid var(--accent-fill);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.authbox{max-width:420px;margin:8vh auto 0;display:grid;gap:14px}
.authbox .field input{width:100%}
.authmsg{margin:0;font-size:14px;color:var(--bad)}
.authmsg.ok{color:var(--good)}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.authbox input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.stage > .btn{justify-self:start}
/* ---- v3: docked assistant, admin console, uploads ---- */
:root{--chat-size:400px;--chat-w:0px}
body{padding-right:var(--chat-w);transition:padding-right .2s ease}
body.chat-open{--chat-w:var(--chat-size)}
body.chat-resizing{transition:none;user-select:none;cursor:col-resize}
@media (max-width:999px){body.chat-open{--chat-w:0px}}
.toast{left:calc(50% - var(--chat-w,0px)/2)}
.chatfab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;
  border:0;border-radius:999px;padding:12px 18px;min-height:48px;background:var(--ink);color:var(--bg);font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body[data-view="quiz"] .chatfab{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.chatfab svg{width:18px;height:18px}
.chat{position:fixed;top:0;right:0;bottom:0;width:var(--chat-size);z-index:40;display:grid;grid-template-rows:auto 1fr auto auto;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 36px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.chat-grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2;touch-action:none}
.chat-grip:hover,.chat-resizing .chat-grip{background:color-mix(in srgb,var(--accent-fill) 55%,transparent)}
.chat-backdrop{display:none}
@media (max-width:999px){
  .chat{width:min(100vw,430px)}
  .chat-grip{display:none}
  .chat-backdrop:not([hidden]){display:block;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.35)}
}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}

   Everything lives in your Supabase account, so every browser you sign in on sees the same sections, questions, progress and notes.

     custom.topics = [{id,name,blurb,p}]   p = parent section id (null = top level), so sections can nest to any depth
     custom.qs     = [{id,t,n,q,o,a,...}]  t = the topic the question sits in

const UNLOCK = 0.7;

  ["notes","Personal notes","Write their own notes under mistakes"],
  ["reset","Reset progress","Erase their own progress and XP"],
  ["own_content","Own content","Create private sections and import their own questions"]

async function fetchAll(table,order){

const kids=id=>allTopics().filter(t=>(t.p||null)===(id||null));
function descIds(id){const out=[id];kids(id).forEach(k=>out.push(...descIds(k.id)));return out}
function qsUnder(id){const s=new Set(descIds(id));return allQs().filter(q=>s.has(q.t))}

/* ---------- Helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* ---------- Code in questions ----------
   `inline code` becomes a monospace chip; ```fenced blocks``` become a real snippet with indentation kept and light colouring. */
const CODE_KW=new Set("def class return if elif else for while in not and or is import from as with try except finally raise pass break continue lambda yield global nonlocal del assert async await True False None function const let var new this typeof instanceof switch case default do throw throws catch int float double char void long short bool boolean string String public private protected static final null undefined self super extends implements interface struct enum include using namespace def end puts print println printf".split(" "));
const SLASH_LANGS=new Set(["js","javascript","ts","typescript","java","c","cpp","c++","cs","csharp","c#","go","rust","rs","kotlin","swift","php","scala","dart"]);
function hl(code,lang){
  lang=String(lang||"").toLowerCase();
  const slash=SLASH_LANGS.has(lang),hash=!slash;      // "//" is floor-division in Python, so only treat it as a comment for C-style languages
  const re=slash?/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g
              :/((?:^|(?<=\s))#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/gm;
  let out="",last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));last=m.index+m[0].length;
    if(m[1])out+=`<span class="tk-c">${esc(m[1])}</span>`;
    else if(m[2])out+=`<span class="tk-s">${esc(m[2])}</span>`;
    else if(m[3])out+=`<span class="tk-n">${esc(m[3])}</span>`;
    else out+=CODE_KW.has(m[4])?`<span class="tk-k">${esc(m[4])}</span>`:esc(m[4]);
  }
  return out+esc(code.slice(last));
}
/* inline: `code` and **bold** (text is escaped first, so this is safe) */
function rich1(s){return esc(s).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")}
/* options that are plainly code (like [(0, 0), (0, 1)] or list(range(3))) get monospace even without backticks */
function looksCode(s){s=String(s).trim();return /^[\[({].*[\])}]$/.test(s)&&!/\s[A-Za-z]{2,}\s/.test(s)}
function optHtml(s){return !/`/.test(s)&&looksCode(s)?`<code class="oc">${esc(s)}</code>`:rich1(s)}
function fmtQ(s){
  s=String(s);const re=/```([A-Za-z0-9_+#.-]*)[ \t]*\n([\s\S]*?)\n?```/g;
  const text=t=>{let h=rich1(t).replace(/\n/g,"<br>");h=h.replace(/\s*(Statement[\s-]*(?:\d|I{1,3})\s*:)/g,"<br><b>$1</b>");return h.replace(/^(<br>)+/,"").replace(/(<br>)+$/,"")};
  let out="",last=0,m;
  while((m=re.exec(s))){
    out+=text(s.slice(last,m.index));
    out+=`<pre class="codeq"><code>${hl(m[2].replace(/\s+$/,""),m[1])}</code></pre>`;last=m.index+m[0].length;
  }
  return out+text(s.slice(last));
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const L=k=>String.fromCharCode(65+k);
const qType=q=>q.ty||"mcq";
const rightSet=q=>qType(q)==="msq"?q.a:qType(q)==="sa"?[]:[q.a];
const TYPE_TAG={mcq:"MCQ",msq:"MSQ",sa:"SA"};
function ansText(q){if(qType(q)==="sa")return q.ans;return rightSet(q).map(i=>`${L(i)}. ${q.o[i]}`).join("  ·  ")}
function pickText(q,p){if(p===undefined||p===null)return "";if(qType(q)==="sa")return String(p).trim()||"(blank)";const a=Array.isArray(p)?p:[p];return a.length?a.map(i=>`${L(i)}. ${q.o[i]}`).join("  ·  "):"(nothing)"}
const normA=s=>String(s).toLowerCase().replace(/[\s,]+/g," ").replace(/[.\s]+$/,"").trim();
const isNum=s=>/^\s*-?[\d,]+(\.\d+)?\s*$/.test(String(s));
const toNum=s=>{const m=String(s).replace(/,/g,"").match(/-?\d+(\.\d+)?/);return m?+m[0]:null};
function checkSA(q,txt){
  if(!String(txt).trim())return false;
  if(q.acc&&q.acc.min!=null){const v=toNum(txt);return v!=null&&v>=q.acc.min&&v<=q.acc.max}
  const list=Array.isArray(q.acc)?q.acc:[q.ans], t=normA(txt);
  return list.some(a=>normA(a)===t||(isNum(a)&&/^\s*-?[\d,.]+\s*[a-z%]*\s*$/i.test(txt)&&toNum(txt)===toNum(a)));
}

/* ---------- Sessions ---------- */
function startSession(mode,title,ids,shuf){
  if(!ids.length){toast("No questions here yet");return}
  chatResetQ();
  const m=qMap();
  session={mode,title,ids,i:0,pick:null,sel:[],draft:"",results:[],streak:0,best:0,xp:0,
    perm:ids.map(id=>{const idx=m[id].o.map((_,k)=>k);return shuf&&canShuffleOpts(m[id])?shuffle(idx):idx})};
  go("quiz");
}
function topicIds(t){
  const tq=allQs().filter(q=>q.t===t).sort((a,b)=>a.n-b.n);
  const unseen=tq.filter(q=>!P(q.id).s), wrong=tq.filter(q=>P(q.id).l===0), right=tq.filter(q=>P(q.id).l===1);
  return unseen.concat(shuffle(wrong),shuffle(right)).map(q=>q.id);
}
function mixedIds(scope,count){
  const pool=scope?qsUnder(scope):allQs(), n=count||mixedCount;
  const scored=pool.map(q=>{const p=P(q.id);return {id:q.id,s:Math.random()+(p.l===0?0.7:0)+(!p.s?0.35:0)}});
  scored.sort((a,b)=>b.s-a.s);
  const ids=scored.map(x=>x.id);
  return shuffle(n==="All"?ids:ids.slice(0,n));
}

function cur(){return qMap()[session.ids[session.i]]}
function grade(ok,pick,fx){
  const id=session.ids[session.i];
  const p=progress[id]||{s:0,c:0,w:0}; p.s=(p.s||0)+1; p.t=Date.now(); if(ok){p.c=(p.c||0)+1;p.l=1}else{p.w=(p.w||0)+1;p.l=0;p.wp=pick}
  progress[id]=p;
  let gain=0;
  if(ok){session.streak++;gain=10+Math.min(session.streak-1,5)*2;session.xp+=gain;session.best=Math.max(session.best,session.streak)}
  else session.streak=0;
  meta.xp=(meta.xp||0)+gain; meta.best=Math.max(meta.best||0,session.best);
  saveProgress(id,p); saveMeta(gain);
  session.results.push({id,ok,pick});
  buzz(ok?15:[30,40,30]);
  renderQuiz(Object.assign({anim:ok?"pop":"shake",gain},fx));
}
function answer(k){
  if(session.pick!==null) return;
  const q=cur(); if(qType(q)==="msq") return toggleSel(k); if(qType(q)!=="mcq") return;
  const orig=session.perm[session.i][k]; session.pick=k; grade(orig===q.a,orig,{k});
}
function toggleSel(k){
  if(session.pick!==null) return; const s=session.sel||(session.sel=[]), i=s.indexOf(k);
  if(i>=0) s.splice(i,1); else s.push(k); renderQuiz();
}
function submitMsq(){
  const q=cur(); if(session.pick!==null||!(session.sel||[]).length) return;
  const perm=session.perm[session.i], orig=session.sel.map(k=>perm[k]).sort((a,b)=>a-b);
  const ok=orig.length===q.a.length&&orig.every(x=>q.a.includes(x));
  session.pick=session.sel.slice(); grade(ok,orig,{});
}
function submitSa(){
  const q=cur(); if(session.pick!==null) return; const el=document.getElementById("sa-input");
  const txt=(el?el.value:session.draft||"").trim(); if(!txt){if(el)el.focus();return}
  session.pick=txt; grade(checkSA(q,txt),txt,{});
}
function markRight(){
  const r=session.results[session.results.length-1]; if(!r||r.ok||r.id!==session.ids[session.i]) return;
  r.ok=true; r.over=true; const p=progress[r.id]; p.w=Math.max(0,(p.w||1)-1); p.c=(p.c||0)+1; p.l=1;
  session.streak++; const gain=10+Math.min(session.streak-1,5)*2; session.xp+=gain; session.best=Math.max(session.best,session.streak);
  meta.xp=(meta.xp||0)+gain; meta.best=Math.max(meta.best||0,session.best);
  saveProgress(r.id,p); saveMeta(gain);
  renderQuiz({gain});
}

function next(){
  session.i++; session.pick=null; session.sel=[]; session.draft="";
  if(session.i>=session.ids.length) return go("summary");
  renderQuiz(); window.scrollTo(0,0);
}


/* ---------- Quiz view ---------- */
function renderQuiz(fx){renderQuizBase(fx);chatSync()}
function renderQuizBase(fx){
  const q=cur(); if(!q){go("home");return}
  const ty=qType(q), perm=session.perm[session.i]||[], done=session.pick!==null;
  const res=done?session.results[session.results.length-1]:null, ok=!!(res&&res.ok);
  const right=rightSet(q), sel=session.sel||[];
  let body="";
  if(ty==="sa"){
    body=done?`<div class="sa-done ${ok?"good":"bad"}"><span class="eyebrow">Your answer</span><b>${esc(session.pick)}</b></div>`
      :`<div class="sa-box"><label for="sa-input" class="eyebrow">Your answer</label><input id="sa-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type your answer" value="${esc(session.draft||"")}"></div>`;
  }else{
    body=`<div class="opts ${ty==="msq"?"multi":""}">`+perm.map((orig,k)=>{
      const isR=right.includes(orig), picked=ty==="msq"?(done?session.pick.includes(k):sel.includes(k)):session.pick===k;
      let cls="",mark="";
      if(done){ if(isR&&picked){cls="good";mark=ICON.check} else if(isR){cls=ty==="msq"?"missed":"good";mark=ICON.check} else if(picked){cls="bad";mark=ICON.x} else cls="dim" }
      else if(picked) cls="sel";
      if(fx&&fx.k===k&&fx.anim) cls+=" "+fx.anim;
      return `<button class="opt ${cls}" data-act="pick" data-k="${k}" ${done?"disabled":""}${ty==="msq"&&!done?` aria-pressed="${picked}"`:""}><span class="key">${L(k)}</span><span class="otext">${optHtml(q.o[orig])}</span><span class="mark">${mark}</span></button>`;
    }).join("")+`</div>`;
  }
  const dispAns=ty==="sa"?esc(q.ans):right.map(i=>`${L(perm.indexOf(i))}. ${optHtml(q.o[i])}`).join("<br>");
  let verdict=ok?(res.over?"Counted as correct":session.streak>=3?`${CHEERS_HOT[session.i%CHEERS_HOT.length]} ${session.streak} in a row`:CHEERS[(session.i+session.streak)%CHEERS.length]):OOPS[session.i%OOPS.length];
  if(done&&!ok&&ty==="msq"){const pk=session.pick.map(k=>perm[k]),hit=pk.filter(x=>right.includes(x)).length,wrong=pk.length-hit;
    verdict=`Almost · ${hit} of ${right.length} right${wrong?`, ${wrong} wrong pick${wrong>1?"s":""}`:""}`}
  const explain=done?`<section class="explain ${ok?"good":"bad"}">
      <div class="verdict">${verdict}</div>
      ${ok&&ty!=="sa"?"":`<p><span class="eyebrow">${ty==="msq"?"Correct answers":"Answer"}</span><br><b>${dispAns}</b></p>`}
      ${ty==="sa"&&!ok?`<p class="small" style="margin:0"><button class="link" data-act="mark-right">My answer means the same thing. Count it as correct</button></p>`:""}
      <p>${rich1(q.e||"No explanation was included with this question.")}</p>
      <p class="memo"><span class="eyebrow">Remember</span><br>${rich1(quickNote(q))}</p>
      ${q.flag?`<p class="flagnote"><b>Key check:</b> ${esc(q.flag)}</p>`:""}
    </section>`:"";
  const hint=done?"":ty==="msq"?`<p class="hint">Select all that apply, then submit.</p>`:ty==="sa"?`<p class="hint">Type your answer. Numbers can include units, like "128 ms".</p>`:"";
  const n=session.i+1, tot=session.ids.length, last=n===tot;
  let bar="";
  if(done) bar=`<button class="btn primary" data-act="next" id="nextbtn">${last?"See results":"Next question"} <span class="mono" style="opacity:.6">↵</span></button>`;
  else if(ty==="msq") bar=`<button class="btn primary" data-act="submit-msq" ${sel.length?"":"disabled"}>${sel.length?`Submit ${sel.length} selected`:"Select at least one option"}</button>`;
  else if(ty==="sa") bar=`<button class="btn primary" data-act="submit-sa">Check answer <span class="mono" style="opacity:.6">↵</span></button>`;
  $app.innerHTML=`
  <div class="qtop">
    <div class="qtop-row">
      <button class="iconbtn" data-act="quit" aria-label="End session">${ICON.x}</button>
      <div class="eyebrow" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(session.title)}</div>
      <div class="hud"><span class="streak ${session.streak>=3?"hot":""}" title="Streak">${ICON.bolt}${session.streak}</span><span>${session.xp} XP</span></div>
    </div>
    <div class="meter" aria-label="Question ${n} of ${tot}"><span style="width:${((session.i+(done?1:0))/tot)*100}%"></span></div>
  </div>
  <div class="qcard">
    <div class="qmeta"><span class="tag mono">Q${q.n} · ${n}/${tot}</span><span class="tag type-${ty}">${TYPE_TAG[ty]}</span><span class="tag">${esc(topicName(q.t))}</span>${q.src?`<span class="tag mono">${esc(q.src)}</span>`:""}${q.flag?`<span class="tag warn">Key check</span>`:""}</div>
    <div class="qtext" role="heading" aria-level="2">${fmtQ(q.q)}</div>
    ${hint}
    ${body}
    ${explain}
  </div>
  ${bar?`<div class="bottombar">${bar}</div>`:""}`;
  if(fx&&fx.gain){const b=(fx.k!=null&&$app.querySelector(`.opt[data-k="${fx.k}"]`))||$app.querySelector(".explain .verdict");if(b){const r=b.getBoundingClientRect();const f=document.createElement("div");f.className="xpfloat";f.textContent="+"+fx.gain+" XP";f.style.left=Math.max(16,Math.min(window.innerWidth-100,r.right-90))+"px";f.style.top=(r.top+8)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),900)}}
  if(done){const ex=$app.querySelector(".explain");if(ex){const r=ex.getBoundingClientRect();if(r.bottom>window.innerHeight-80) window.scrollBy({top:Math.min(r.top-90,r.bottom-window.innerHeight+100),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}}
  else if(ty==="sa"&&!fx){const el=document.getElementById("sa-input");if(el){try{el.focus({preventScroll:true})}catch(e){}}}
}

/* ---------- Summary ---------- */
function renderSummary(){
  const m=qMap(), r=session.results, right=r.filter(x=>x.ok).length, tot=r.length, pct=tot?Math.round(right/tot*100):0;
  const C=2*Math.PI*62, missed=r.filter(x=>!x.ok);
  const msg=pct>=90?"Brilliant, you're exam ready on this set":pct>=70?"Solid work. Tidy up the misses":pct>=50?"Getting there, keep going":"Good start. One more round will help";
  const list=missed.map(x=>{const q=m[x.id];return `<div class="mitem"><div class="eyebrow">Q${q.n} · ${esc(topicName(q.t))}</div><div class="q">${fmtQ(q.q)}</div>
    <div class="yours">You ${qType(q)==="sa"?"answered":"chose"}: ${esc(pickText(q,x.pick))}</div><div class="a">Answer: ${esc(ansText(q))}</div><div class="r">${rich1(q.e||"")}</div></div>`}).join("");
  $app.innerHTML=`<div class="result">
    <div class="result-top">
      <svg class="ring" viewBox="0 0 150 150" role="img" aria-label="${pct}% correct">
        <circle cx="75" cy="75" r="62" fill="none" stroke="var(--led-off)" stroke-width="12"/>
        <circle cx="75" cy="75" r="62" fill="none" stroke="${pct>=70?"var(--good)":"var(--accent-fill)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct/100} ${C}" transform="rotate(-90 75 75)"/>
        <text x="75" y="82" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="30" font-weight="600" fill="var(--ink)">${pct}%</text>
      </svg>
      <div style="display:grid;gap:6px;min-width:0"><div class="eyebrow">${esc(session.title)}</div><h1>${msg}</h1>
        <p class="muted" style="margin:0">${right} of ${tot} correct · +${session.xp} XP · best streak ${session.best}</p></div>
    </div>
    <div class="row">${missed.length?`<button class="btn primary" data-act="retry">Retry ${missed.length} missed</button>`:""}${can("mistake_log")?`<button class="btn" data-act="go-log">Mistake log</button>`:""}<button class="btn" data-act="home">Back to topics</button></div>
    ${missed.length?`<h2 style="font-size:22px;margin-top:10px">What you missed</h2><div class="missed">${list}</div>`:`<p class="muted">No misses this round.</p>`}
  </div>`;
}

/* ---------- Study (read answers) ---------- */

/* ---------- Add questions ---------- */
/* "Auto" splits a paste into numbered sets of 15, in question order, as new sub-topics of the chosen section */
function planSets(items,parent){
  const sorted=items.slice().sort((a,b)=>a.n-b.n), start=kids(parent).filter(t=>/^Set \d+/.test(t.name)).length, plan=[];
  for(let i=0;i<sorted.length;i+=SET_SIZE){const chunk=sorted.slice(i,i+SET_SIZE),k=start+plan.length+1;
    const a=chunk[0].n,b=chunk[chunk.length-1].n;
    plan.push({id:uid(),name:`Set ${k}`+(a&&b?` · Q${a}–Q${b}`:""),items:chunk})}
  return plan;
}

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function addSeen(seen){allQs().forEach(q=>{seen.add(norm(q.q));if(q.o.length)seen.add(q.n+"|"+norm(q.o.join("|")))})}
const cleanHead=s=>s.replace(/\*\*|__/g,"").replace(/^\s*(topic|section|unit|chapter|module)\s*[:\-–]\s*/i,"").replace(/[:\s]+$/,"").trim();
const prettyName=f=>f.replace(/\.[a-z0-9]+$/i,"").replace(/[_-]+/g," ").trim()||"Imported questions";

/* One heading block -> a question. Returns null when it isn't a question, {bad:true} when it is one but incomplete. */
function parseQBlock(head,body){
  const nm=head.match(/^\s*\**\s*Q?\s*(\d+)/i);
  const tyHint=((head.match(/\((MCQ|MSQ|SA)\)\s*$/i)||[])[1]||"").toUpperCase();
  const hq=head.replace(/\((MCQ|MSQ|SA)\)\s*$/i,"").replace(/^\s*Q?\s*\d+\s*[.):-]?\s*/i,"").replace(/\*\*/g,"").trim();
  const headIsQ=!/…|\.\.\.\s*$/.test(hq)&&(/\?\s*$/.test(hq)||hq.split(" ").length>4);
  let qL=[],opts=[],ansRaw=null,notes=[],memo="",inF=false;
  const unbold=x=>/`/.test(x)?x.replace(/^\*\*(.+)\*\*$/,"$1"):x.replace(/\*\*/g,"");
  for(const raw of body){
    if(!opts.length&&ansRaw===null){
      const tr=raw.trim();
      if(/^(```|~~~)/.test(tr)){inF=!inF;qL.push(tr.replace(/^~~~/,"```").replace(/\s+$/,""));continue}
      if(inF){qL.push(raw.replace(/\s+$/,""));continue}
    }
    const l=raw.trim().replace(/\s*\\$/,""); if(!l||/^-{3,}$/.test(l)) continue; let mm;
    if((mm=l.match(/^(?:[-*]\s*)?\(?([A-H])[.)]\s+(.+)$/))&&(opts.length||qL.length||headIsQ)&&ansRaw===null){opts.push(unbold(mm[2]).trim());continue}
    if(ansRaw===null&&(mm=l.match(/^\*{0,2}\s*(?:answer(?:\s+shown)?|ans|correct\s+answers?|correct)\s*\*{0,2}\s*:\s*\*{0,2}\s*(.+)$/i))){ansRaw=mm[1].replace(/\*\*/g,"").trim();continue}
    if((mm=l.match(/^\*{0,2}\s*(remember|quick note|key point)\s*\*{0,2}\s*:\s*\*{0,2}\s*(.*)$/i))){memo=mm[2].trim();continue}
    if((mm=l.match(/^\*{0,2}\s*(reasoning|reason|explanation|solution|note|verification note)\s*\*{0,2}\s*:\s*\*{0,2}\s*(.*)$/i))){notes.push(mm[2]);continue}
    if(!opts.length&&ansRaw===null&&!/^\*{0,2}\s*key check/i.test(l)) qL.push(unbold(l.replace(/^\*{0,2}\s*question\s*\*{0,2}\s*:\s*/i,"")));
  }
  let qt=qL.join("\n").trim();
  if(!qt&&headIsQ) qt=hq;
  if(!opts.length&&ansRaw===null) return null;
  if(!qt||ansRaw===null) return {bad:true};
  let item;
  if(opts.length>=2){
    const lead=ansRaw.match(/^[\s(]*([A-Ha-h])\b[).]?((?:\s*(?:,|&|and)\s*\(?[A-Ha-h]\b\)?)*)/);
    if(!lead) return {bad:true};
    const idx=[...new Set([lead[1]].concat(lead[2].match(/\b[A-Ha-h]\b/g)||[]).map(x=>x.toUpperCase().charCodeAt(0)-65))].sort((a,b)=>a-b);
    if(idx.some(i=>i>=opts.length)) return {bad:true};
    item=(idx.length>1||tyHint==="MSQ")?{q:qt,o:opts,ty:"msq",a:idx}:{q:qt,o:opts,a:idx[0]};
  }else{
    item={q:qt,o:[],ty:"sa",ans:ansRaw};
    const r=ansRaw.match(/^(-?[\d,.]+)\s*(?:to|–|-)\s*(-?[\d,.]+)$/);
    if(r) item.acc={min:toNum(r[1]),max:toNum(r[2])};
    else if(/\s(?:\/|or)\s/i.test(ansRaw)) item.acc=ansRaw.split(/\s(?:\/|or)\s/i).map(x=>x.trim()).filter(Boolean);
  }
  item.e=notes.join(" "); if(memo) item.k=memo;
  return {item,num:nm?+nm[1]:null};
}

/* Markdown -> questions grouped by topic.
   Any heading that is not a question is a topic; deeper headings nest inside shallower ones, and each question
   belongs to the closest topic above it. So   # Networking / ## Q1 ...   and   # Cloud / ## IaaS / ### Q1 ...   both work. */
function parseMd(text,opt){
  opt=opt||{};
  const seen=opt.seen||new Set(); if(!opt.seen&&!opt.noDup) addSeen(seen);
  const blocks=[]; let cur=null,fence=false;
  for(const ln of String(text).replace(/\r\n?/g,"\n").split("\n")){
    if(/^\s*(```|~~~)/.test(ln)) fence=!fence;
    const m=!fence&&ln.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/);
    if(m){cur={lvl:m[1].length,head:m[2].trim(),body:[]};blocks.push(cur)} else if(cur) cur.body.push(ln);
  }
  const pre=opt.prefix||"", nodes=[], items=[], stack=[], counters={}; let dup=0,incomplete=0;
  for(const b of blocks){
    const r=parseQBlock(b.head,b.body);
    if(r&&r.bad){incomplete++;continue}
    if(r){
      const top=stack.length?stack[stack.length-1].node:null, ck=top?top.key:"", it=r.item;
      const n=r.num!=null?r.num:(counters[ck]=(counters[ck]||0)+1);
      const k1=norm(it.q), k2=it.o.length?n+"|"+norm(it.o.join("|")):null;
      if(!opt.noDup&&(seen.has(k1)||(k2&&seen.has(k2)))){dup++;continue}
      seen.add(k1); if(k2)seen.add(k2);
      it.n=n; it.tk=top?top.key:null; items.push(it); continue;
    }
    if(/^\s*\**\s*Q\s*\d+|^\s*\d+\s*[.):]/i.test(b.head)) continue;   // a numbered heading with no content
    const name=cleanHead(b.head); if(!name) continue;
    while(stack.length&&stack[stack.length-1].lvl>=b.lvl) stack.pop();
    const blurb=(b.body.map(l=>l.trim()).find(l=>l&&!/^-{3,}$/.test(l))||"").replace(/[*_`>#]/g,"").slice(0,140);
    const node={key:pre+"t"+nodes.length,name,blurb,pk:stack.length?stack[stack.length-1].node.key:null};
    nodes.push(node); stack.push({lvl:b.lvl,node});
  }
  // drop topics that ended up with no questions anywhere inside them (intro text, table of contents...)
  const byKey={},cnt={}; nodes.forEach(n=>byKey[n.key]=n);
  items.forEach(i=>{let k=i.tk,g=0;while(k&&g++<30){cnt[k]=(cnt[k]||0)+1;k=byKey[k]?byKey[k].pk:null}});
  const topics=nodes.filter(n=>cnt[n.key]);
  return {items,topics,dup,incomplete};
}
function addSources(){
  const s=addState.files.map((f,i)=>({name:f.name,text:f.text,i}));
  if(addState.text.trim()) s.push({name:"",text:addState.text,i:"p"});
  return s;
}
function parseAll(){
  const seen=new Set(); addSeen(seen);
  const res={items:[],topics:[],dup:0,incomplete:0,headed:false,files:addState.files.length};
  addSources().forEach(s=>{
    const r=parseMd(s.text,{seen,prefix:"s"+s.i+"_"}), fb=s.name?prettyName(s.name):"Imported questions";
    r.items.forEach(it=>{it.fb=fb}); res.items.push(...r.items); res.topics.push(...r.topics); res.dup+=r.dup; res.incomplete+=r.incomplete;
  });
  res.headed=res.topics.length>0;
  return res;
}

/* Where new sections should be visible. Admins choose; everyone else's imports stay private to them. */
function accForNew(par){
  if(!isAdmin()) return {mode:"hidden",users:[]};
  const m=addState.acc;
  if(m==="same"){const p=par?topicById(par):null;return p?{mode:p.acc,users:p.acc==="selected"?(GR.topics[p.id]||[]):[]}:{mode:"everyone",users:[]}}
  return {mode:m,users:m==="selected"?addState.accUsers.slice():[]};
}
/* Turns a preview into the sections + questions that would be created (also used for the "where they'll go" list) */
function buildPlan(pv,par){
  const topics=[],qs=[],dist={},ac=accForNew(par);
  const exist=(parent,name)=>{const lc=name.toLowerCase();return allTopics().concat(topics).find(t=>(t.p||null)===(parent||null)&&t.name.toLowerCase()===lc&&(isAdmin()||ownedBy(t)))};
  const mk=(parent,name,blurb)=>{const ex=exist(parent,name);if(ex)return {id:ex.id,isNew:!!topics.includes(ex)};
    const t={id:uid(),name,blurb:blurb||"",p:parent||null,own:USER.id,acc:ac.mode};topics.push(t);return {id:t.id,isNew:true}};
  const place=(tid,it)=>{qs.push(Object.assign({},it,{id:"c"+uid(),t:tid,own:USER.id,acc:"inherit"}));dist[tid]=(dist[tid]||0)+1};
  if(addState.mode==="heads"&&pv.headed){
    const idOf={};
    pv.topics.forEach(n=>{idOf[n.key]=mk(n.pk?idOf[n.pk]:(par||null),n.name,n.blurb).id});
    pv.items.forEach(it=>place(it.tk?idOf[it.tk]:mk(par||null,it.fb).id,it));
  }else if(addState.mode==="here"&&par){
    pv.items.forEach(it=>place(par,it));
  }else if(addState.mode==="new"){
    const id=mk(par||null,(addState.newTopic||"").trim()||"New topic","Questions you added").id;
    pv.items.forEach(it=>place(id,it));
  }else{
    planSets(pv.items,par).forEach(s=>{topics.push({id:s.id,name:s.name,blurb:`${s.items.length} questions`,p:par,own:USER.id,acc:ac.mode});s.items.forEach(it=>place(s.id,it))});
  }
  const look=id=>topics.find(t=>t.id===id)||topicById(id);
  const path=id=>{const o=[];let t=look(id),g=0;while(t&&g++<30){o.unshift(t.name);t=t.p?look(t.p):null}return o.join(" › ")};
  return {topics,qs,ac,dist:Object.entries(dist).map(([id,count])=>({path:path(id),count,isNew:topics.some(t=>t.id===id)})).sort((a,b)=>a.path.localeCompare(b.path))};
}
function freshAdd(par,mode){return ({text:"",files:[],parent:par||"",mode:mode||"auto",modeTouched:false,newTopic:"",preview:null,busy:false,acc:"same",accUsers:[]})}

      <select id="accsel"><option value="same" ${addState.acc==="same"?"selected":""}>Same as the parent section (everyone at top level)</option><option value="everyone" ${addState.acc==="everyone"?"selected":""}>Everyone</option><option value="selected" ${addState.acc==="selected"?"selected":""}>Only selected users…</option><option value="hidden" ${addState.acc==="hidden"?"selected":""}>Nobody yet (hidden draft)</option></select>

  $app.innerHTML=`<div class="backrow"><button class="iconbtn" data-act="back-add" aria-label="Back">${ICON.back}</button><div><div class="eyebrow">Question bank</div><h2 style="font-size:24px">Add questions</h2></div></div>
  <div style="display:grid;gap:16px;max-width:720px;margin-top:10px">
    <p class="muted" style="margin:0">Upload a markdown file (or paste text). Headings that aren't questions become <b>topics</b>, so one file can fill many sections at once; a <span class="mono">#</span> heading is a topic, and a deeper heading nests inside it. MCQ, MSQ (<span class="mono">Answer: A, C</span>) and short answers (no options, <span class="mono">Answer: 128</span>) all work, and duplicates are skipped.</p>

async function commitAdd(){
  const pv=addState.preview; if(!pv||!pv.items.length||addState.busy) return;
  const par=addState.parent||null, plan=buildPlan(pv,par);
  if(!canCreateIn(par)){toast("Your account can't add questions there.");return}
  addState.busy=true; render();
  let ok=await dbAddTopics(plan.topics)&&await dbAddQs(plan.qs);
  if(ok&&isAdmin()&&plan.ac.mode==="selected") ok=await dbGrantTopics(plan.topics.map(t=>t.id),plan.ac.users);
  addState.busy=false;
  if(!ok){render();return}
  custom.topics=custom.topics.concat(plan.topics); custom.qs=custom.qs.concat(plan.qs);
  toast(`Added ${plan.qs.length} question${plan.qs.length>1?"s":""}`);
  nav=par; addState=freshAdd(par);
  go("home");
}
async function addReadFiles(list){
  const got=[];
  for(const f of Array.from(list||[])){
    if(f.size>2*1024*1024){toast(`${f.name} is over 2 MB. Split it first.`);continue}
    try{got.push({name:f.name,text:await f.text()})}catch(e){toast(`Couldn't read ${f.name}`)}
  }
  if(!got.length)return;
  addState.files=addState.files.concat(got); addState.preview=null; render();
  toast(`Loaded ${got.length} file${got.length>1?"s":""}. Press “Check questions”.`);
}

function mdText(s){
  const lines=esc(s).split("\n");let out="",list=null;
  const close=()=>{if(list){out+=`</${list}>`;list=null}};
  const inl=t=>t.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  for(const raw of lines){const l=raw.trim();let m;
    if(!l){close();continue}
    if((m=l.match(/^[-*•]\s+(.*)$/))){if(list!=="ul"){close();out+="<ul>";list="ul"}out+=`<li>${inl(m[1])}</li>`}
    else if((m=l.match(/^\d+[.)]\s+(.*)$/))){if(list!=="ol"){close();out+="<ol>";list="ol"}out+=`<li>${inl(m[1])}</li>`}
    else if((m=l.match(/^#{1,4}\s+(.*)$/))){close();out+=`<p><b>${inl(m[1])}</b></p>`}
    else{close();out+=`<p>${inl(l)}</p>`}}
  close();return out;
}

function chatCtx(){
  const role=isAdmin()?"admin":"student";
  if(view==="quiz"&&session&&cur()){
    const q=cur(),ty=qType(q),perm=session.perm[session.i]||[],done=session.pick!==null,res=done?session.results[session.results.length-1]:null;
    const c={view:"quiz",role,question:q.q,type:TYPE_TAG[ty],topic:pathName(q.t),answered:done};
    if(ty!=="sa")c.options=perm.map((orig,k)=>({key:L(k),text:q.o[orig]}));
    if(done){
      c.correct=ty==="sa"?q.ans:rightSet(q).map(i=>L(perm.indexOf(i)));
      c.studentAnswer=ty==="sa"?session.pick:(ty==="msq"?session.pick:[session.pick]).map(k=>L(k));
      c.wasCorrect=!!(res&&res.ok);c.explanation=q.e||"";
    }
    return c;
  }
  const brief=q=>({q:q.q,options:qType(q)==="sa"?undefined:q.o,answer:ansText(q),why:q.e||""});
  if(view==="home"){
    const sec=nav?topicById(nav):null,scope=sec?qsUnder(nav):allQs(),s=statsOf(scope),by={};
    allQs().forEach(q=>(by[q.t]=by[q.t]||[]).push(q));

    return {view:"home",role,where:sec?pathName(nav):"All sections",subtopics:kids(nav).map(t=>t.name).slice(0,30),
      stats:{questions:s.total,coveredPct:Math.round(s.cov*100),mastered:s.mastered,accuracyPct:s.att?Math.round(s.cor/s.att*100):null},weak,sample:scope.slice(0,14).map(q=>q.q)};
  }
  if(view==="study"){const t=topicById(studyTopic);return {view:"study",role,topic:t?pathName(t.id):"",items:allQs().filter(q=>q.t===studyTopic).sort((a,b)=>a.n-b.n).slice(0,12).map(brief)}}
  if(view==="log"){const d=logData();return {view:"log",role,stillWrong:d.open.length,fixed:d.fixed.length,items:d.list.slice(0,12).map(q=>Object.assign({topic:pathName(q.t),times:P(q.id).w},brief(q)))}}
  if(view==="summary"&&session){const m=qMap(),r=session.results,missed=r.filter(x=>!x.ok);
    return {view:"summary",role,title:session.title,right:r.length-missed.length,total:r.length,items:missed.slice(0,10).map(x=>Object.assign({yourAnswer:pickText(m[x.id],x.pick)},brief(m[x.id])))}}
  if(view==="tnotes"||view==="allnotes"){
    const t=view==="tnotes"?topicById(NV.topic):null,list=(view==="tnotes"?notesFor(NV.topic):visibleNotes().sort((a,b)=>b.at-a.at)).slice(0,25);
    return {view:"notes",role,topic:t?pathName(t.id):"",items:list.map(n=>({topic:pathName(n.t),body:n.body}))};
  }
  return {view:view==="admin"||view==="add"||view==="qedit"?view:"other",role};
}

function chatInit(){
  if(document.getElementById("chat-root"))return;
  const root=document.createElement("div");root.id="chat-root";root.innerHTML=CHAT_HTML;document.body.appendChild(root);
  document.documentElement.style.setProperty("--chat-size",CHAT.size+"px");
  const grip=document.getElementById("cgrip");
  grip.addEventListener("pointerdown",e=>{
    e.preventDefault();grip.setPointerCapture(e.pointerId);document.body.classList.add("chat-resizing");
    const mv=ev=>{CHAT.size=Math.max(320,Math.min(640,window.innerWidth-ev.clientX));document.documentElement.style.setProperty("--chat-size",CHAT.size+"px")};
    const up=()=>{grip.removeEventListener("pointermove",mv);grip.removeEventListener("pointerup",up);document.body.classList.remove("chat-resizing");chatSave()};
    grip.addEventListener("pointermove",mv);grip.addEventListener("pointerup",up);
  });
}
function chatSync(){
  topbarSync();chatInit();
  const on=!!USER&&!PROFILE.disabled&&can("tutor")&&!["loading","setup","auth","disabled"].includes(view);
  const open=on&&CHAT.open;
  document.body.classList.toggle("chat-open",open);document.body.dataset.view=view;
  document.getElementById("cfab").hidden=!on||open;
  document.getElementById("chat").hidden=!open;
  document.getElementById("cback").hidden=!open;
  if(open)chatRender();
}
function chatToggle(){
  CHAT.open=!CHAT.open;chatSave();chatSync();
  if(CHAT.open){const t=document.getElementById("cin");if(t&&window.innerWidth>=1000)try{t.focus({preventScroll:true})}catch(e){}}
}
function chatRender(){
  const info=chatInfo(),th=CHAT.threads[info.key]||[];
  document.getElementById("cmode").textContent=info.mode||"";
  document.getElementById("ctitle").textContent=info.title;
  const intro=th.length?"":`<p class="cintro">${esc(info.intro)}</p>`;
  const box=document.getElementById("cmsgs");
  box.innerHTML=intro+th.map(m=>m.role==="user"?`<div class="cmsg user">${esc(m.content)}</div>`:`<div class="cmsg bot ${m.err?"err":""}">${m.err?esc(m.content):mdLite(m.content)}</div>`).join("")+(CHAT.busy?`<div class="cmsg bot"><span class="dots"><i></i><i></i><i></i></span></div>`:"");
  const sig=info.key+":"+th.length+":"+CHAT.busy;
  if(sig!==CHAT.sig){CHAT.sig=sig;box.scrollTop=box.scrollHeight}
  document.getElementById("cchips").innerHTML=CHAT.busy?"":(info.chips||[]).map(p=>`<button class="chip" data-act="chat-chip" data-p="${esc(p)}">${esc(p)}</button>`).join("");
  document.getElementById("csend").disabled=CHAT.busy;
}
async function chatSend(text){
  text=(text||"").trim();if(!text||CHAT.busy||!USER)return;
  const info=chatInfo(),th=CHAT.threads[info.key]=CHAT.threads[info.key]||[];
  th.push({role:"user",content:text});CHAT.busy=true;chatRender();
  try{
    const {data}=await sb.auth.getSession();if(!data.session)throw new Error("Please sign in again.");
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+data.session.access_token},
      body:JSON.stringify({messages:th.filter(m=>!m.err).slice(-12).map(({role,content})=>({role,content})),context:chatCtx()})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j.error||"The assistant is unavailable.");
    th.push({role:"assistant",content:j.reply});
  }catch(e){th.push({role:"assistant",content:"Sorry, I couldn't answer that. "+e.message,err:true})}
  CHAT.busy=false;if(!document.getElementById("chat").hidden)chatRender();
}
function chatSendInput(){const t=document.getElementById("cin");if(!t)return;const v=t.value;t.value="";t.style.height="";chatSend(v)}

    <div class="field"><label for="qe-topic">Section</label><select id="qe-topic" data-qe="topic">${tOpts}</select></div>

    <div class="field"><label for="qe-q">Question <span class="muted small">(code: use &#96;&#96;&#96; fences for blocks and &#96;backticks&#96; for inline)</span></label><textarea id="qe-q" data-qe="q" style="min-height:90px;font-family:var(--body);font-size:15px">${esc(QE.q)}</textarea></div>
    ${choice?`<div class="field"><label for="qe-opts">Options (one per line, letters are added for you)</label><textarea id="qe-opts" data-qe="opts" style="min-height:120px">${esc(QE.opts)}</textarea></div>`:""}
    <div class="field"><label for="qe-ans">${choice?(QE.ty==="msq"?"Correct letters, e.g. A, C":"Correct letter, e.g. B"):"Correct answer (use “a / b” for alternatives, or “10 to 12” for a range)"}</label><input type="text" id="qe-ans" data-qe="ans" value="${esc(QE.ans)}" autocomplete="off"></div>
    <div class="field"><label for="qe-why">Explanation (shown after answering)</label><textarea id="qe-why" data-qe="why" style="min-height:80px;font-family:var(--body);font-size:15px">${esc(QE.why)}</textarea></div>
    <div class="field"><label for="qe-memo">Quick note to remember</label><input type="text" id="qe-memo" data-qe="memo" value="${esc(QE.memo)}" autocomplete="off"></div>
    ${QE.err?`<p class="authmsg">${esc(QE.err)}</p>`:""}
    <div class="row"><button class="btn primary" data-act="qe-save">Save question</button><button class="btn ghost" data-act="qe-back">Cancel</button>${QE.id&&canEdit(qMap()[QE.id])?`<button class="btn danger" data-act="q-del" data-id="${QE.id}">Delete</button>`:""}</div>
  </div>`;
}
function qeToMd(){
  const L1=s=>String(s).replace(/\s*\n\s*/g," ").trim(), lines=[`## Q${QE.n||1}${QE.ty==="msq"?" (MSQ)":""}`];
  {let f=false;QE.q.trim().split("\n").forEach(x=>{const t=x.trim();if(/^(```|~~~)/.test(t)){f=!f;lines.push(t);return}if(f)lines.push(x.replace(/\s+$/,""));else if(t)lines.push(t)})}
  if(QE.ty!=="sa")QE.opts.split("\n").map(s=>s.trim()).filter(Boolean).forEach((s,i)=>lines.push(`- ${L(i)}. ${s.replace(/^\(?[A-Ha-h][.)]\s+/,"")}`));
  lines.push(`**Answer:** ${L1(QE.ans)}`);
  if(L1(QE.why))lines.push(`**Reason:** ${L1(QE.why)}`);
  if(L1(QE.memo))lines.push(`**Remember:** ${L1(QE.memo)}`);
  return lines.join("\n");
}
async function saveQE(){
  if(!QE.topic){QE.err="Choose a section for this question.";return render()}
  const old=QE.id?qMap()[QE.id]:null;
  QE.n=old?old.n:Math.max(0,...allQs().filter(q=>q.t===QE.topic).map(q=>q.n||0))+1;
  const it=parseMd(qeToMd(),{noDup:true}).items[0];
  if(!it){QE.err=QE.ty==="sa"?"Add the question and its correct answer.":"Couldn't read that. Put at least two options (one per line) and answer with a letter that exists, like B (or A, C for several).";return render()}
  const q=Object.assign({},it,{id:old?old.id:"c"+uid(),t:QE.topic,n:QE.n,own:old?old.own:USER.id,acc:old?old.acc:"inherit"});
  delete q.tk;delete q.fb;
  if(!(await dbAddQs([q])))return;
  const i=custom.qs.findIndex(x=>x.id===q.id);if(i>=0)custom.qs[i]=q;else custom.qs.push(q);
  toast(old?"Question updated":"Question added");go(QE.back&&QE.back!=="qedit"?QE.back:"home");
}

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="sa-input"&&session){session.draft=el.value}
  if(el.id==="mdtext"){addState.text=el.value;addState.preview=null}
  if(el.id==="newtopic"){addState.newTopic=el.value}
  if(el.id==="secname"){secForm.name=el.value}
  if(el.id==="cin"){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,110)+"px"}
  if(el.id==="adm-uq"){ADM.uq=el.value;const b=document.getElementById("adm-body");if(b)b.innerHTML=adminBody()}
  if(el.dataset&&el.dataset.pf){const f=el.value.trim().toLowerCase();el.closest(".picker").querySelectorAll(".pickrow").forEach(r=>{r.hidden=!!f&&!r.dataset.email.includes(f)})}
  if(el.dataset&&el.dataset.qe&&el.dataset.qe!=="ty"&&el.dataset.qe!=="topic"){QE[el.dataset.qe]=el.value}
  if(el.id==="nt-new")NV.draft=el.value;
  if(el.id==="nt-edit")NV.editText=el.value;

  if(el.classList&&el.classList.contains("mynote")){if(!can("notes"))return;const id=el.dataset.id,v=el.value.trim();if(v)myNotes[id]=el.value;else delete myNotes[id];saveNote(id,v?el.value:"")}
});
document.addEventListener("change",e=>{

  else if(el.id==="modesel"){addState.mode=el.value;addState.modeTouched=true;render()}
  else if(el.id==="accsel"){addState.acc=el.value;render()}
  else if(el.id==="nt-pick"){if(el.value){NV.back="allnotes";NV.topic=el.value;NV.draft="";NV.edit=null;go("tnotes")}}
  else if(el.id==="mdfile"){addReadFiles(el.files);el.value=""}
  else if(el.dataset&&el.dataset.qe){QE[el.dataset.qe]=el.value;if(el.dataset.qe==="ty")render()}
  else if(a==="adm-perm"){setUserPerm(el.dataset.u,el.dataset.p,el.checked)}
  else if(a==="adm-defperm"){saveDefaultPerm(el.dataset.p,el.checked)}

  else if(a==="adm-cascade"&&ADM.draft){ADM.draft.cascade=el.checked}
  else if(a==="adm-qacc"){
    const id=el.dataset.id;
    if(el.value==="selected"){ADM.qd={id,users:(GR.qs[id]||[]).slice()};refreshAdmin()}
    else setQuestionAccess(id,el.value,[]);
  }
  else if(a==="pick"){
    const list=pickList(el.dataset.key);if(!list)return;
    const i=list.indexOf(el.dataset.u);if(el.checked&&i<0)list.push(el.dataset.u);if(!el.checked&&i>=0)list.splice(i,1);
    const c=el.closest(".picker").querySelector(".pickcount");if(c)c.textContent=list.length+" selected";

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&CHAT.open&&!document.getElementById("chat").hidden){chatToggle();return}
  if(e.key!=="Enter")return;const id=e.target.id;
  if((e.ctrlKey||e.metaKey)&&id==="nt-new"){e.preventDefault();addNote(NV.topic);return}
  if((e.ctrlKey||e.metaKey)&&id==="nt-edit"){e.preventDefault();saveNoteEdit(NV.edit);return}
  if(id==="auth-email"||id==="auth-pass"){e.preventDefault();doAuth("in")}
  else if(id==="secname"){e.preventDefault();createSection(secForm.name,nav)}
  else if(id==="cin"&&!e.shiftKey){e.preventDefault();chatSendInput()}
});

document.addEventListener("keydown",e=>{
  if(view!=="quiz"||!session||e.metaKey||e.ctrlKey||e.altKey) return;
  const ae=document.activeElement;
  if(ae&&ae.id==="sa-input"){if(e.key==="Enter"){e.preventDefault();submitSa()}return}
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(ae&&ae.tagName)) return;
  const k=e.key.toLowerCase(), n=(session.perm[session.i]||[]).length, ty=qType(cur()||{});
  let idx=-1; if(/^[1-9]$/.test(k)) idx=+k-1; else if(/^[a-h]$/.test(k)) idx=k.charCodeAt(0)-97;
  if(session.pick===null&&idx>=0&&idx<n){e.preventDefault();answer(idx)}
  else if(session.pick===null&&ty==="msq"&&k==="enter"){e.preventDefault();submitMsq()}
  else if(session.pick!==null&&(k==="enter"||k===" "||k==="arrowright")){e.preventDefault();next()}
});
