[build]
  publish = "public"
  functions = "netlify/functions"

# Rewrite /api/config -> Netlify function
[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

# Rewrite /api/chat -> Netlify function
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

# SPA fallback: serve index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

